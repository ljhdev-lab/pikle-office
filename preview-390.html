<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 미리보기</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d4cc; }
  .wrap { width: 390px; height: 844px; margin: 0; }
  iframe { width: 390px; height: 844px; border: 0; display: block; background: #f6f2ec; }
</style>
</head>
<body>
<div class="wrap"><iframe id="frame" src="./index.html?v=38" title="별이 비서실 390 미리보기"></iframe></div>
<script>
  window.__errs = [];
  var f = document.getElementById('frame');
  f.addEventListener('load', function () {
    try {
      f.contentWindow.addEventListener('error', function (e) {
        window.__errs.push('error: ' + (e.message || e.type));
      });
      f.contentWindow.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('rejection: ' + e.reason);
      });
    } catch (e) { window.__errs.push('attach failed: ' + e.message); }
  });
</script>
</body>
</html>
