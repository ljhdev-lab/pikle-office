<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390×844 검증 미리보기</title>
<style>
  html, body { margin: 0; background: #2b2b2b; }
  body { display: flex; gap: 16px; padding: 16px; font: 12px/1.45 system-ui, sans-serif; align-items: flex-start; }
  #f { width: 390px; height: 844px; border: 0; background: #fff; border-radius: 14px; }
  pre { color: #dcdcdc; font-size: 11.5px; white-space: pre-wrap; max-width: 460px; }
</style>
</head>
<body>
<iframe id="f" src="./index.html?p=1" width="390" height="844" title="비서실 390 미리보기"></iframe>
<pre id="log">loading…</pre>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    var d = f.contentWindow.document;
    setTimeout(function () {
      var r = {};
      r.syncText = (d.getElementById('syncText') || {}).textContent;
      r.syncCount = (d.getElementById('syncCount') || {}).textContent;
      r.chatBadges = d.querySelectorAll('#taskList .chat-badge').length;
      r.taskItems = d.querySelectorAll('#taskList .item').length;
      r.workMeta = (d.getElementById('workMeta') || {}).textContent;
      r.todayStats = (d.getElementById('todayStats') || {}).textContent;
      r.party = [].map.call(d.querySelectorAll('.pm'), function (c) {
        return c.querySelector('.pm__name').textContent + ' ' +
          c.querySelector('.pm__n').textContent + ' / ' + c.querySelector('.pm__tk').textContent;
      });
      r.titles = [].map.call(d.querySelectorAll('#taskList .item__title'), function (t) { return t.textContent; });
      document.getElementById('log').textContent = JSON.stringify(r, null, 1);
    }, 2600);
  });
</script>
</body>
</html>
