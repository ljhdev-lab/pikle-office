<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390×844 검증</title>
<style>
  html, body { margin: 0; height: 100%; background: #2f2f33; }
  body { display: grid; place-items: center; overflow: hidden; }
  .frame { width: 390px; height: 844px; border: 0; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<iframe class="frame" id="frame" src="./index.html?v=59" width="390" height="844" title="비서실 390×844"></iframe>
<script>
  window.__errors = [];
  window.addEventListener('error', function (e) { window.__errors.push(String(e.message)); });
  document.getElementById('frame').addEventListener('load', function () {
    var w = this.contentWindow;
    w.addEventListener('error', function (e) { window.__errors.push('frame: ' + e.message); });
    w.addEventListener('unhandledrejection', function (e) { window.__errors.push('reject: ' + e.reason); });
  });
</script>
</body>
</html>
