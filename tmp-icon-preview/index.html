<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>아이콘 후보</title>
<style>

  .row{display:flex;align-items:center;gap:10px;background:#fdfaf5;border:1px solid #e7dfd3;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .ico{width:36px;height:36px;flex:none;filter:drop-shadow(0 4px 7px rgba(36,59,89,.18))}

  p{margin:2px 0 0;font-size:11.5px;color:#8a8378}
  .big{display:flex;gap:14px;flex-wrap:wrap}
  .big figure{margin:0;text-align:center;font-size:11px;color:#8a8378}
  .big img{width:120px;height:120px;image-rendering:pixelated;display:block;margin-bottom:4px}
  .lab{font-size:11px;color:#8a8378;min-width:28px}
